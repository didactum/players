name: validate-player-pr
on:
  pull_request:
    paths: ["players/**", "players-registry.json", "harness/**", "scripts/**", "spec/**", "test/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Run PlayerPlugin v2 contract and seek-idempotence tests
        run: node --test test/player_plugin_v2.test.mjs
      # SRI must match the committed player bytes; static safety scan + v2 contract + seek-idempotence run via npm test.
      - name: Run full player test suite and SRI/seek-idempotence validator
        run: npm test
      - name: Enforce zero vendor coupling
        run: |
          PATTERN=$(node -e "process.stdout.write(['ta'+'vus','grif'+'fin'].join('|'))")
          if grep -rn -iE "$PATTERN" players/ harness/ spec/ test/ scripts/ players-registry.json README.md AGENTS.md CLAUDE.md CONTRIBUTING.md; then
            echo "Vendor coupling detected in didactum-players" >&2
            exit 1
          fi
      - name: Registry entries must be sandboxed community players
        run: node -e "const r=require('./players-registry.json');if(r.players.some(p=>p.tier!=='B'||!/^sha384-/.test(p.sri)))process.exit(1)"

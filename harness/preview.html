<!doctype html><meta charset="utf-8"><title>Player preview</title>
<style>body{font:16px system-ui;max-width:820px;margin:1.5rem auto;padding:0 1rem}#stage{border:1px solid #888;min-height:320px;margin:1rem 0}iframe{width:100%;height:320px;border:0}pre{background:#eee;padding:.5rem;max-height:200px;overflow:auto}</style>
<select id="player"></select> <button id="load">Load</button> <button id="play">Play</button> <button id="pause">Pause</button> <button id="ask">Interrupt</button>
<div id="stage"></div><pre id="log"></pre>
<script type="module">
import { createSandboxedPlayer } from "/harness/iframe_bridge.js";
const log = (...a) => { document.getElementById("log").textContent += a.map((x) => typeof x === "string" ? x : JSON.stringify(x)).join(" ") + "\n"; };
const reg = await (await fetch("/players-registry.json")).json();
const lesson = await (await fetch("/spec/sample-lesson.json")).json();
const sel = document.getElementById("player"); sel.innerHTML = reg.players.map((p) => `<option>${p.id}</option>`).join("");
// A fake host so players can be exercised without any server.
const host = {
  tts: { synthesizeStream: async (text) => ({ durationMs: text.split(/\s+/).length * 350, wordTimings: [] }) },
  realtime: { connect: async (o) => { log("realtime.connect", o); return { remoteMediaStream: null, sendData: (d) => log("sendData", d), close: () => log("close") }; } },
  tutor: { ask: async (ctx, input) => `(stub tutor) you asked: ${input}` },
  telemetry: { reportPlayback: async (a) => { log("telemetry", a); } },
};
let ctrl;
document.getElementById("load").onclick = async () => {
  if (ctrl) await ctrl.destroy();
  const entry = reg.players.find((p) => p.id === sel.value);
  const stage = document.getElementById("stage"); stage.textContent = "";
  ctrl = createSandboxedPlayer(stage, { pluginUrl: "/" + entry.path, sri: entry.sri, lesson, host });
  for (const e of ["ready", "statechange", "beatchange", "checkin", "error", "complete"]) ctrl.on(e, (p) => log(e, p ?? ""));
  try { await ctrl.mount(); } catch (err) { log("mount failed:", err.message); }
};
document.getElementById("play").onclick = () => ctrl && ctrl.play();
document.getElementById("pause").onclick = () => ctrl && ctrl.pause();
document.getElementById("ask").onclick = () => ctrl && ctrl.interrupt("wait, why?");
</script>
